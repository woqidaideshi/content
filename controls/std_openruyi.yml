---
policy: 'Standard Benchmark for openRuyi'
title: 'Standard Benchmark for openRuyi'
id: std_openruyi
version: '1.0'
levels:
  - id: base

controls:
  - id: 1.1_bootloader_password
    title: Ensure Bootloader Password is Set
    levels:
      - base
    status: automated
    rules:
      - grub2_password
      - grub2_password.severity=high
      - grub2_uefi_password
      - grub2_uefi_password.severity=high

  - id: 1.2_single_user_mode_password
    title: Ensure Single User Mode Requires Authentication
    levels:
      - base
    status: automated
    rules:
      - require_singleuser_auth
      - require_singleuser_auth.severity=high
      - require_emergency_target_auth
      - require_emergency_target_auth.severity=high

  - id: 1.3_umask_configured
    title: Ensure Umask is Configured Correctly
    levels:
      - base
    status: automated
    rules:
      - accounts_umask_etc_bashrc
      - accounts_umask_etc_bashrc.severity=high
      - accounts_umask_etc_login_defs
      - accounts_umask_etc_login_defs.severity=high
      - accounts_umask_etc_profile
      - accounts_umask_etc_profile.severity=high
      - var_accounts_user_umask=027

  - id: 1.4_filesystem_permissions
    title: Ensure Filesystem Permissions are Secure
    levels:
      - base
    status: automated
    rules:
      - dir_perms_world_writable_sticky_bits
      - dir_perms_world_writable_sticky_bits.severity=high
      - file_permissions_unauthorized_world_writable
      - file_permissions_unauthorized_world_writable.severity=high
      - no_files_unowned_by_user
      - no_files_unowned_by_user.severity=high
      - file_permissions_ungroupowned
      - file_permissions_ungroupowned.severity=high
      - file_empty_link_prohibit
      - file_empty_link_prohibit.severity=high
      - file_hidden_executable_prohibit
      - file_hidden_executable_prohibit.severity=high

  - id: 1.5_critical_files_ownership
    title: Ensure Critical Files Ownership is Correct
    levels:
      - base
    status: automated
    rules:
      - file_owner_etc_passwd
      - file_owner_etc_passwd.severity=high
      - file_groupowner_etc_passwd
      - file_groupowner_etc_passwd.severity=high
      - file_permissions_etc_passwd
      - file_permissions_etc_passwd.severity=high
      - file_owner_etc_shadow
      - file_owner_etc_shadow.severity=high
      - file_groupowner_etc_shadow
      - file_groupowner_etc_shadow.severity=high
      - file_permissions_etc_shadow
      - file_permissions_etc_shadow.severity=high
      - file_owner_etc_group
      - file_owner_etc_group.severity=high
      - file_groupowner_etc_group
      - file_groupowner_etc_group.severity=high
      - file_permissions_etc_group
      - file_permissions_etc_group.severity=high
      - file_owner_etc_gshadow
      - file_owner_etc_gshadow.severity=high
      - file_groupowner_etc_gshadow
      - file_groupowner_etc_gshadow.severity=high
      - file_permissions_etc_gshadow
      - file_permissions_etc_gshadow.severity=high

  - id: 1.6_crypto_policy_configured
    title: Ensure System Crypto Policy is Configured
    levels:
      - base
    status: automated
    rules:
      - configure_crypto_policy
      - configure_crypto_policy.severity=high
      - var_system_crypto_policy=default_policy

  - id: 2.1_auditd_configured
    title: Ensure Auditd is Configured
    levels:
      - base
    status: automated
    rules:
      - package_audit_installed
      - package_audit_installed.severity=high
      - service_auditd_enabled
      - service_auditd_enabled.severity=high
      - grub2_audit_argument
      - grub2_audit_argument.severity=low
      - grub2_audit_backlog_limit_argument
      - grub2_audit_backlog_limit_argument.severity=low
      - var_auditd_max_log_file=6
      - var_auditd_max_log_file_action=rotate
      - var_audit_backlog_limit=8192

  - id: 2.2_audit_rules_configured
    title: Ensure Critical Audit Rules are Loaded
    levels:
      - base
    status: automated
    rules:
      - audit_rules_immutable
      - audit_rules_immutable.severity=high
      - audit_rules_sysadmin_actions
      - audit_rules_sysadmin_actions.severity=high
      - audit_rules_suid_privilege_function
      - audit_rules_suid_privilege_function.severity=high
      - audit_sudo_log_events
      - audit_sudo_log_events.severity=high
      - audit_rules_time_adjtimex
      - audit_rules_time_adjtimex.severity=high
      - audit_rules_time_settimeofday
      - audit_rules_time_settimeofday.severity=high
      - audit_rules_time_clock_settime
      - audit_rules_time_clock_settime.severity=high
      - audit_rules_networkconfig_modification
      - audit_rules_networkconfig_modification.severity=high
      - audit_rules_privileged_commands
      - audit_rules_privileged_commands.severity=high
      - audit_rules_usergroup_modification_group
      - audit_rules_usergroup_modification_group.severity=high
      - audit_rules_usergroup_modification_passwd
      - audit_rules_usergroup_modification_passwd.severity=high
      - audit_rules_usergroup_modification_shadow
      - audit_rules_usergroup_modification_shadow.severity=high
      - audit_rules_dac_modification_chmod
      - audit_rules_dac_modification_chmod.severity=high
      - audit_rules_dac_modification_chown
      - audit_rules_dac_modification_chown.severity=high
      - audit_rules_file_deletion_events_unlink
      - audit_rules_file_deletion_events_unlink.severity=high
      - audit_rules_file_deletion_events_rename
      - audit_rules_file_deletion_events_rename.severity=high
      - audit_rules_mac_modification
      - audit_rules_mac_modification.severity=high
      - audit_rules_execution_chcon
      - audit_rules_execution_chcon.severity=high
      - audit_rules_kernel_module_loading_init
      - audit_rules_kernel_module_loading_init.severity=high

  - id: 2.3_journald_configured
    title: Ensure Journald is Configured
    levels:
      - base
    status: automated
    rules:
      - service_systemd-journald_enabled
      - service_systemd-journald_enabled.severity=high
      - journald_compress
      - journald_compress.severity=low
      - journald_storage
      - journald_storage.severity=low

  - id: 2.4_memory_protection_enabled
    title: Ensure Memory Protection is Enabled
    levels:
      - base
    status: automated
    rules:
      - sysctl_kernel_randomize_va_space
      - sysctl_kernel_randomize_va_space.severity=high
      - sysctl_kernel_exec_shield
      - sysctl_kernel_exec_shield.severity=high
      - sysctl_kernel_kptr_restrict
      - sysctl_kernel_kptr_restrict.severity=high

  - id: 2.5_cron_permissions_configured
    title: Ensure Cron Permissions are Configured
    levels:
      - base
    status: automated
    rules:
      - file_owner_crontab
      - file_owner_crontab.severity=high
      - file_groupowner_crontab
      - file_groupowner_crontab.severity=high
      - file_permissions_crontab
      - file_permissions_crontab.severity=high
      - file_owner_cron_allow
      - file_owner_cron_allow.severity=high
      - file_groupowner_cron_allow
      - file_groupowner_cron_allow.severity=high
      - file_permissions_cron_allow
      - file_permissions_cron_allow.severity=high

  - id: 2.6_ensure_a_single_time_synchronization_daemon_used
    title: Ensure a single time synchronization daemon is in use (Automated)
    levels:
      - base
    status: automated
    rules:
      - var_timesync_service=systemd-timesyncd
      - package_timesyncd_installed
      - service_timesyncd_enabled
      - service_chronyd_disabled
    notes: |
      To select which timesync daemon to install and configure, use the
      profile variable var_timesync_service.

  - id: 2.7_service_minimization
    title: Ensure Unnecessary Services are Removed
    levels:
      - base
    status: automated
    rules:
      - package_xinetd_removed
      - package_xinetd_removed.severity=low
      - package_dhcp_removed
      - package_dhcp_removed.severity=low
      - package_bind_removed
      - package_bind_removed.severity=low
      - package_vsftpd_removed
      - package_vsftpd_removed.severity=low
      - package_tftp-server_removed
      - package_tftp-server_removed.severity=low
      - package_httpd_removed
      - package_httpd_removed.severity=low
      - package_nginx_removed
      - package_nginx_removed.severity=low
      - package_cyrus-imapd_removed
      - package_cyrus-imapd_removed.severity=low
      - package_dovecot_removed
      - package_dovecot_removed.severity=low
      - package_samba_removed
      - package_samba_removed.severity=low
      - package_squid_removed
      - package_squid_removed.severity=low
      - package_net-snmp_removed
      - package_net-snmp_removed.severity=low
      - package_ypserv_removed
      - package_ypserv_removed.severity=low
      - package_telnet_removed
      - package_telnet_removed.severity=low
      - package_telnet-server_removed
      - package_telnet-server_removed.severity=low
      - package_rsync_removed
      - package_rsync_removed.severity=low
      - package_rsh_removed
      - package_rsh_removed.severity=low
      - package_rsh-server_removed
      - package_rsh-server_removed.severity=low
      - package_sendmail_removed
      - package_sendmail_removed.severity=low
      - package_ypbind_removed
      - package_ypbind_removed.severity=low
      - package_talk-server_removed
      - package_talk-server_removed.severity=low
      - package_talk_removed
      - package_talk_removed.severity=low
      - service_nfs_disabled
      - service_nfs_disabled.severity=low
      - service_rpcbind_disabled
      - service_rpcbind_disabled.severity=low

  - id: 3.1_sshd_hardening
    title: Ensure SSHD is Hardened
    levels:
      - base
    status: automated
    rules:
      - file_owner_sshd_config
      - file_owner_sshd_config.severity=high
      - file_groupowner_sshd_config
      - file_groupowner_sshd_config.severity=high
      - file_permissions_sshd_config
      - file_permissions_sshd_config.severity=high
      - sshd_set_loglevel_verbose
      - sshd_set_loglevel_verbose.severity=high
      - sshd_enable_pam
      - sshd_enable_pam.severity=high
      - sshd_disable_root_login
      - sshd_disable_root_login.severity=high
      - disable_host_auth
      - disable_host_auth.severity=high
      - sshd_disable_empty_passwords
      - sshd_disable_empty_passwords.severity=high
      - sshd_do_not_permit_user_env
      - sshd_do_not_permit_user_env.severity=high
      - sshd_disable_rhosts
      - sshd_disable_rhosts.severity=high
      - sshd_disable_x11_forwarding
      - sshd_disable_x11_forwarding.severity=high
      - sshd_disable_tcp_forwarding
      - sshd_disable_tcp_forwarding.severity=high
      - sshd_set_max_auth_tries
      - sshd_set_max_auth_tries.severity=high
      - var_sshd_set_maxstartups=10:30:60
      - var_sshd_max_sessions=10
      - var_sshd_set_login_grace_time=60
      - sshd_set_idle_timeout
      - sshd_set_idle_timeout.severity=high
      - sshd_set_keepalive
      - sshd_set_keepalive.severity=high
      - var_rekey_limit_size=1G
      - var_rekey_limit_time=1hour
      - sshd_use_strong_rng
      - sshd_use_strong_rng.severity=high

  - id: 4.1_network_hardening
    title: Ensure Network is Hardened
    levels:
      - base
    status: automated
    rules:
      - kernel_module_sctp_disabled
      - kernel_module_sctp_disabled.severity=low
      - kernel_module_dccp_disabled
      - kernel_module_dccp_disabled.severity=low
      - sysctl_net_ipv4_conf_all_send_redirects
      - sysctl_net_ipv4_conf_all_send_redirects.severity=high
      - sysctl_net_ipv4_conf_default_send_redirects
      - sysctl_net_ipv4_conf_default_send_redirects.severity=high
      - sysctl_net_ipv4_conf_all_accept_source_route
      - sysctl_net_ipv4_conf_all_accept_source_route.severity=high
      - sysctl_net_ipv4_conf_default_accept_source_route
      - sysctl_net_ipv4_conf_default_accept_source_route.severity=high
      - sysctl_net_ipv6_conf_all_accept_source_route
      - sysctl_net_ipv6_conf_all_accept_source_route.severity=high
      - sysctl_net_ipv6_conf_default_accept_source_route
      - sysctl_net_ipv6_conf_default_accept_source_route.severity=high
      - sysctl_net_ipv4_conf_all_accept_redirects
      - sysctl_net_ipv4_conf_all_accept_redirects.severity=high
      - sysctl_net_ipv4_conf_default_accept_redirects
      - sysctl_net_ipv4_conf_default_accept_redirects.severity=high
      - sysctl_net_ipv6_conf_all_accept_redirects
      - sysctl_net_ipv6_conf_all_accept_redirects.severity=high
      - sysctl_net_ipv6_conf_default_accept_redirects
      - sysctl_net_ipv6_conf_default_accept_redirects.severity=high
      - sysctl_net_ipv4_conf_all_secure_redirects
      - sysctl_net_ipv4_conf_all_secure_redirects.severity=high
      - sysctl_net_ipv4_conf_default_secure_redirects
      - sysctl_net_ipv4_conf_default_secure_redirects.severity=high
      - sysctl_net_ipv4_conf_all_log_martians
      - sysctl_net_ipv4_conf_all_log_martians.severity=high
      - sysctl_net_ipv4_conf_default_log_martians
      - sysctl_net_ipv4_conf_default_log_martians.severity=high
      - sysctl_net_ipv4_icmp_echo_ignore_broadcasts
      - sysctl_net_ipv4_icmp_echo_ignore_broadcasts.severity=high
      - sysctl_net_ipv4_icmp_ignore_bogus_error_responses
      - sysctl_net_ipv4_icmp_ignore_bogus_error_responses.severity=high
      - sysctl_net_ipv4_conf_all_rp_filter
      - sysctl_net_ipv4_conf_all_rp_filter.severity=high
      - sysctl_net_ipv4_conf_default_rp_filter
      - sysctl_net_ipv4_conf_default_rp_filter.severity=high
      - sysctl_net_ipv4_tcp_syncookies
      - sysctl_net_ipv4_tcp_syncookies.severity=high

  - id: 4.2_firewalld_configured
    title: Ensure Firewalld is Configured
    levels:
      - base
    status: automated
    rules:
      - package_firewalld_installed
      - package_firewalld_installed.severity=high
      - service_firewalld_enabled
      - service_firewalld_enabled.severity=high
      - service_nftables_disabled
      - service_nftables_disabled.severity=high

  - id: 5.1_selinux_enforcing
    title: Ensure SELinux is Enforcing
    levels:
      - base
    status: automated
    rules:
      - package_libselinux_installed
      - package_libselinux_installed.severity=high
      - grub2_enable_selinux
      - grub2_enable_selinux.severity=high
      - selinux_policytype
      - selinux_policytype.severity=high
      - var_selinux_policy_name=targeted
      - selinux_state
      - selinux_state.severity=high
      - package_mcstrans_removed
      - package_mcstrans_removed.severity=high
      - sysctl_fs_protected_hardlinks
      - sysctl_fs_protected_hardlinks.severity=high
      - sysctl_fs_protected_symlinks
      - sysctl_fs_protected_symlinks.severity=high

  - id: 5.2_periodic_compliance_scans
    title: Ensure Periodic Compliance Scans are Performed
    levels:
      - base
    status: manual
